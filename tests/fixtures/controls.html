<!doctype html>
<html>
  <body>
    <button data-control data-width="120" data-height="40" style="height:40px;padding:8px 12px;gap:8px;border:0;border-radius:8px;background:rgb(0,0,0);color:rgb(255,255,255);font:400 14px/20px Arial">Delete account</button>
    <button data-control data-width="180" data-height="40" style="height:40px;padding:8px 12px;gap:8px;border:0;border-radius:8px;background:rgb(0,0,0);color:rgb(255,255,255);font:400 14px/20px Arial">
      <svg aria-label="private brand path"><path /></svg>
      Search messages
    </button>
    <input data-control data-width="240" data-height="40" placeholder="Private project name" style="height:40px;padding:8px 12px;border:1px solid rgb(180,180,180);border-radius:8px;background:rgb(255,255,255);color:rgb(20,20,20);font:400 14px/20px Arial" />
    <textarea data-control data-width="240" data-height="80" style="height:80px;padding:12px;border:1px solid rgb(180,180,180);border-radius:8px;background:rgb(255,255,255);color:rgb(20,20,20);font:400 14px/20px Arial">Private notes</textarea>
    <select data-control data-width="180" data-height="40" style="height:40px;padding:8px 12px;border:1px solid rgb(180,180,180);border-radius:8px;background:rgb(255,255,255);color:rgb(20,20,20);font:400 14px/20px Arial"><option>Private workspace</option></select>
    <div data-control data-width="44" data-height="24" role="switch" aria-checked="true" style="height:24px;width:44px;border:0;border-radius:12px;background:rgb(0,120,255);color:rgb(255,255,255);font:400 14px/20px Arial"></div>
    <input data-control data-width="20" data-height="20" type="checkbox" style="height:20px;width:20px" />
    <input data-control data-width="20" data-height="20" type="radio" style="height:20px;width:20px" />
    <a data-control data-width="100" data-height="40" href="#safe">Not a button</a>
    <article data-control data-width="240" data-height="80" tabindex="0">Not a control</article>
  </body>
</html>
