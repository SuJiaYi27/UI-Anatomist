name: Feature request
description: Propose a general product improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Example workflow
  - type: textarea
    id: general
    attributes:
      label: Why is this general rather than website-specific?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, and compatibility considerations
